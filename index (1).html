<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Curso Fase Privada para títulos. Inicio enero a junio 2027. Costo Q 1,800, pago único.">
<title>Academia Jurídica</title>

<!-- Tipos de letra de Google Fonts: uno elegante para títulos y uno sencillo para el texto -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap">

<style>
  /* ===== COLORES Y LETRAS (los definimos una sola vez y los reutilizamos) ===== */
  /* Diseño: una sola tarjeta centrada sobre fondo gris, como un aviso de inscripción */
  :root {
    --fondo: #d9dde3;        /* gris de fondo */
    --tarjeta: #f3f5f8;      /* gris muy claro para la tarjeta */
    --azul: #1d3f7a;         /* azul principal de las letras */
    --azul-suave: #4a6496;   /* azul más claro para textos secundarios */
    --linea: #b9c2d0;        /* gris para las líneas divisorias */
    --whatsapp: #1f8f4e;     /* verde del botón de WhatsApp */

    --letra-titulo: "Libre Baskerville", Georgia, serif;
    --letra-texto: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  }

  /* ===== LA PÁGINA COMPLETA ===== */
  html { height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--azul);
    font-family: var(--letra-texto);
    font-size: 17px;
    line-height: 1.5;
    min-height: 100%;
    display: grid;
    place-items: center;               /* centra la tarjeta */
    padding-block: 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ===== LA TARJETA BLANCA DEL CENTRO ===== */
  .tarjeta {
    background: var(--tarjeta);
    width: 100%;
    max-width: 520px;
    border: 1px solid var(--linea);
    border-radius: 6px;
    padding: 40px 32px;
    display: grid;
    gap: 28px;
  }

  /* Nombre de la academia (arriba, pequeño) */
  .academia {
    font-family: var(--letra-titulo);
    font-size: 15px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 0;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--azul);
  }

  /* Etiqueta "Títulos" */
  .etiqueta {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--azul-suave);
    margin: 0 0 6px;
  }

  /* Título grande del curso */
  h1 {
    font-family: var(--letra-titulo);
    font-size: clamp(30px, 7vw, 40px);  /* se achica en el celular */
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
  }

  /* ===== LISTA DE DATOS (fecha y costo) ===== */
  .datos {
    margin: 0;
    display: grid;
    gap: 0;
  }
  .dato {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    padding-block: 14px;
    border-top: 1px solid var(--linea);
  }
  .dato:last-child { border-bottom: 1px solid var(--linea); }
  .dato dt {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--azul-suave);
  }
  .dato dd {
    margin: 0;
    font-weight: 600;
    text-align: right;
  }
  .precio {
    font-family: var(--letra-titulo);
    font-size: 28px;
    font-weight: 700;
  }
  .nota {
    display: block;
    font-family: var(--letra-texto);
    font-size: 14px;
    font-weight: 400;
    color: var(--azul-suave);
  }

  /* ===== BOTÓN DE WHATSAPP ===== */
  .boton-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--whatsapp);
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 18px;
    padding: 16px 20px;
    border-radius: 6px;
    transition: filter 0.15s;
  }
  .boton-whatsapp:hover { filter: brightness(1.1); }
  .boton-whatsapp:focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; }
  .boton-whatsapp svg { width: 24px; height: 24px; fill: currentColor; }

  .telefono {
    text-align: center;
    font-size: 15px;
    color: var(--azul-suave);
    margin: -16px 0 0;
  }
</style>
</head>
<body>

<!-- ===================== CONTENIDO DE LA PÁGINA ===================== -->
<main class="tarjeta">

  <!-- Nombre de la academia -->
  <p class="academia">Academia Jurídica</p>

  <!-- Título del curso -->
  <div>
    <p class="etiqueta">Títulos</p>
    <h1>Curso Fase Privada</h1>
  </div>

  <!-- Datos del curso: fecha y costo -->
  <dl class="datos">
    <div class="dato">
      <dt>Inicio</dt>
      <dd>Enero a junio 2027</dd>
    </div>
    <div class="dato">
      <dt>Costo</dt>
      <dd>
        <span class="precio">Q 1,800</span>
        <span class="nota">Pago único</span>
      </dd>
    </div>
  </dl>

  <!-- Botón de WhatsApp: abre un chat con el número indicado -->
  <!-- CAMBIAR: reemplazar 50200000000 por el número real (502 + 8 dígitos) -->
  <a class="boton-whatsapp"
     href="https://wa.me/50200000000?text=Hola,%20quiero%20información%20del%20Curso%20Fase%20Privada"
     target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3Z"/></svg>
    Escríbenos por WhatsApp
  </a>
  <p class="telefono">+502 0000 0000</p>

</main>
</body>
</html>
